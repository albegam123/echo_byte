<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>EchoByte 配网</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09111d; color: #eef6ff; }
    main { width: min(88vw, 28rem); padding: 2rem; border: 1px solid #223957; border-radius: 1.2rem; background: #101d2e; box-shadow: 0 1rem 4rem #0008; }
    h1 { margin: 0 0 .4rem; color: #65d7ff; }
    p { margin: 0 0 1.5rem; color: #a9bad0; }
    label { display: block; margin: 1rem 0 .35rem; }
    input, select, button { box-sizing: border-box; width: 100%; min-height: 3rem; border-radius: .65rem; border: 1px solid #365273; padding: .7rem; font: inherit; }
    input, select { color: #fff; background: #0a1524; }
    button { margin-top: 1.4rem; border: 0; background: #23a8db; color: #041019; font-weight: 700; }
    button:disabled { opacity: .55; }
    #status { min-height: 1.5em; margin-top: 1rem; color: #ffd66b; }
  </style>
</head>
<body>
  <main>
    <h1>EchoByte</h1>
    <p>选择 2.4 GHz Wi-Fi，并输入密码。</p>
    <form id="form">
      <label for="networks">附近网络</label>
      <select id="networks"><option value="">正在扫描…</option></select>
      <label for="ssid">Wi-Fi 名称</label>
      <input id="ssid" maxlength="32" autocomplete="off" required>
      <label for="password">Wi-Fi 密码</label>
      <input id="password" type="password" maxlength="64" autocomplete="current-password">
      <button id="submit" type="submit">提交并连接 Wi-Fi</button>
      <div id="status" role="status"></div>
    </form>
  </main>
  <script>
    const list = document.querySelector('#networks');
    const ssid = document.querySelector('#ssid');
    const status = document.querySelector('#status');
    fetch('/api/networks', {cache:'no-store'}).then(r => r.json()).then(networks => {
      list.innerHTML = '<option value="">手工输入网络名称</option>';
      for (const network of networks) {
        const option = document.createElement('option');
        option.value = network.ssid;
        option.textContent = `${network.ssid} (${network.rssi} dBm)${network.secure ? ' 🔒' : ''}`;
        list.appendChild(option);
      }
    }).catch(() => { list.innerHTML = '<option value="">手工输入网络名称</option>'; });
    list.addEventListener('change', () => { if (list.value) ssid.value = list.value; });
    document.querySelector('#form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.querySelector('#submit');
      button.disabled = true;
      status.textContent = '正在连接，请稍候…';
      try {
        const response = await fetch('/api/provision', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ssid:ssid.value, password:document.querySelector('#password').value})
        });
        if (!response.ok) throw new Error('提交失败');
        status.textContent = '信息已接收。设备正在切换网络，可以关闭此页面。';
      } catch (error) {
        status.textContent = '提交失败，请重新连接热点后再试。';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
