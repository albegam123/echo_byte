[package]
name = "echo_byte"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
anyhow = "1.0"
async-channel = "2.5"
edge-executor = "0.5"
embedded-svc = "0.29"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
esp32-nimble = "0.12.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
embuild = "0.33"

[patch.crates-io]
# 0.12.0 calls ble_gap_adv_active() after nimble_port_deinit(), which crashes
# ESP-IDF 5.5. Keep the small, documented fix local until upstream releases it.
esp32-nimble = { path = "vendor/esp32-nimble" }

[package.metadata.esp-idf-sys]
esp_idf_components = [
    "main",
    "esp_common",
    "esp_system",
    "esp_event",
    "esp_netif",
    "esp_wifi",
    "nvs_flash",
    "esp_http_server",
    "bt",
    "lwip",
    "pthread",
    "freertos",
    "driver",
    # esp-idf-svc 0.52's std IO module currently expects these bindings.
    "spiffs",
    "fatfs",
    "wear_levelling",
]

[profile.dev]
debug = true
opt-level = "s"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
# Keep symbols in the ELF while the provisioning lifecycle is under board
# validation. espflash only writes loadable sections, so this does not enlarge
# the flash image; switch back to `true` for production artifacts.
strip = false
